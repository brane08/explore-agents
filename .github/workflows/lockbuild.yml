name: lockbuild

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Entry schema validation + checklist layers 1-2
        run: uv run pytest tooling/lockbuild/tests -q
      - name: Orchestrator — checklist layers 3, 4, 10, 11
        run: uv run pytest tooling/orchestrator/tests -q
      - name: Certify — checklist layers 6, 12 (harness conformance)
        run: uv run pytest tooling/certify/tests -q
      - name: Snapshot contract — mirrored schemas vs. the reference tool plane
        # The step above skips this test when fastmcp is absent, which would
        # report green while checking nothing. SNAPSHOT_CONTRACT_REQUIRED turns
        # that skip into a failure, so the gate cannot silently stop running.
        env:
          SNAPSHOT_CONTRACT_REQUIRED: "1"
        run: |
          uv sync --all-packages --all-extras
          uv run pytest tooling/lockbuild/tests/test_snapshot_contract.py -q -rs
      - name: Determinism gate — build twice, diff
        run: |
          uv run lockbuild build --root . --out lock-a.yaml
          uv run lockbuild build --root . --out lock-b.yaml
          diff lock-a.yaml lock-b.yaml
          rm lock-a.yaml lock-b.yaml
      - name: Lock-matches-tree gate
        run: uv run lockbuild verify --root .
