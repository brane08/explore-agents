[tool.uv.workspace]
members = ["agent_app", "b2a_app", "agentflow_ui", "skills_kit"]


[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
    "anyio>=4.14.1",
    "pytest-anyio>=0.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires live MCP server subprocess (run with -m integration)",
    "e2e: end-to-end test that boots reference-tools + agent_app + b2a_app as subprocesses (slow; opt-in via -m e2e)",
]
