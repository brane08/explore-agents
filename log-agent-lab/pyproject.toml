[tool.uv.workspace]
members = ["mcp_server", "agent_app", "b2a_app", "agentflow_ui"]

[tool.pytest.ini_options]
markers = [
    "integration: requires live MCP server subprocess (run with -m integration)",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
    "anyio>=4.14.1",
    "pytest-anyio>=0.0.0",
]
