services:
  mock-log-api:
    build:
      context: ../reference-tools
    command: ["uvicorn", "src.log_mock.api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    networks:
      - lab

  mcp-server:
    build:
      context: ../reference-tools
    environment:
      # Standby: tools currently use in-process _CORPUS; this env var is reserved
      # for a future HTTP-backed tool variant that reads from mock-log-api directly.
      MOCK_LOG_API_URL: "http://mock-log-api:8001"
    ports:
      - "8000:8000"
    depends_on:
      - mock-log-api
    networks:
      - lab

  agent-app:
    build:
      context: ./agent_app
    environment:
      MCP_SERVER_URL: "http://mcp-server:8000"
      AGENT_MODEL: "${AGENT_MODEL:-claude-sonnet-4-6}"
    ports:
      - "8002:8002"
    depends_on:
      - mcp-server
    networks:
      - lab

  b2a-app:
    build:
      context: ./b2a_app
    environment:
      MCP_SERVER_URL: "http://mcp-server:8000"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      B2A_MODEL: "${AGENT_MODEL:-claude-sonnet-4-6}"
    ports:
      - "8003:8003"
    depends_on:
      - mcp-server
    networks:
      - lab

  agentflow-ui:
    build:
      context: ./agentflow_ui
    environment:
      AGENT_APP_URL: "http://agent-app:8002"
      B2A_APP_URL: "http://b2a-app:8003"
    ports:
      - "8501:8501"
    depends_on:
      - agent-app
      - b2a-app
    networks:
      - lab

networks:
  lab:
    driver: bridge
