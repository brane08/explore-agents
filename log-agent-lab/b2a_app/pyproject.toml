[project]
name = "b2a-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.28",
    "langgraph>=0.2",
    "fastmcp>=3.4.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "skills-kit",
]

[tool.uv.sources]
skills-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
