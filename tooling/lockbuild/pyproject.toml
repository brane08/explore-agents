[project]
name = "lockbuild"
version = "0.1.0"
description = "Deterministic catalog.lock.yaml builder for the agent-platform catalog (docs/CATALOG.md §6)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
lockbuild = "lockbuild.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockbuild"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
