[project]
name = "certify"
version = "0.1.0"
description = "Harness conformance fixtures + candidate contract checks (docs/CHECKLISTS.md layers 6, 12; docs/CATALOG.md §8/§10)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "lockbuild",
]

[project.scripts]
certify = "certify.cli:main"

[tool.uv.sources]
lockbuild = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/certify"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
