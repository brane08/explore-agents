[project]
name = "reference-tools"
version = "0.1.0"
description = "Reference MCP server standing in for an external tool plane; backs the seeded catalog entries."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
